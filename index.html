<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff6b6b">
  <meta name="description" content="Подбор рецептов на основе продуктов из холодильника">
  
  <title>Что приготовить</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23ff6b6b' width='100' height='100' rx='20'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white'>🍳</text></svg>">
</head>
<body>
  <div class="container">
    <header>
      <h1>🍳 Что приготовить</h1>
      <p>Выберите продукты из холодильника</p>
    </header>
    
    <div class="card">
      <h2>📦 Ваши продукты</h2>
      
      <div class="stats">
        <div class="stat-item">
          <div class="stat-value" id="selectedCount">0</div>
          <div class="stat-label">Выбрано</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="recipesCount">10</div>
          <div class="stat-label">Рецептов</div>
        </div>
      </div>
      
      <div class="products-grid" id="productsGrid">
        <!-- Продукты генерируются через JavaScript -->
      </div>
      
      <button class="btn" onclick="findRecipes()">
        🔍 Найти рецепты
      </button>
    </div>
    
    <div class="card recipes-container" id="recipesContainer">
      <h2>🍽️ Что можно приготовить</h2>
      <div id="recipesList">
        <!-- Рецепты генерируются через JavaScript -->
      </div>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
